<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的無業配乾淨新聞</title>
    <!-- 引入 Tailwind CSS 漂亮排版 -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="max-w-4xl mx-auto p-4">
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-bold text-blue-600">📰 我的乾淨新聞牆</h1>
            <p class="text-sm text-gray-500 mt-1">AI 已自動過濾業配文與特定記者</p>
        </header>

        <!-- 日期導覽列 (由 Python 動態產生) -->
        <div class="bg-white p-3 rounded-lg shadow mb-6 overflow-x-auto flex gap-2">
            <span class="font-bold text-gray-600 min-w-[50px] align-middle">日期：</span>
            <a href="../index.html" class="px-2 py-1 bg-blue-500 text-white rounded text-sm">最新</a>
            {% for d in date_list %}
            <a href="/archive/{{ d }}.html" class="px-2 py-1 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded text-sm">{{ d }}</a>
            {% endfor %}
        </div>

        <!-- 新聞列表 -->
        <div class="grid gap-6">
            {% for news in news_list %}
            <div class="bg-white rounded-lg shadow-md overflow-hidden flex flex-col md:flex-row">
                {% if news.image_url %}
                <img src="{{ news.image_url }}" class="w-full md:w-48 h-48 object-cover" alt="新聞圖片">
                {% endif %}
                <div class="p-4 flex flex-col justify-between flex-1">
                    <div>
                        <span class="text-xs font-semibold inline-block py-1 px-2 uppercase rounded text-blue-600 bg-blue-200 mb-2">
                            {{ news.source }}
                        </span>
                        <h2 class="text-xl font-bold mb-2 hover:text-blue-500">
                            <a href="{{ news.link }}" target="_blank">{{ news.title }}</a>
                        </h2>
                        <p class="text-gray-600 text-sm line-clamp-3">{{ news.summary }}</p>
                    </div>
                    <div class="text-xs text-gray-400 mt-4">發布時間：{{ news.pub_date }}</div>
                </div>
            </div>
            {% else %}
            <p class="text-center text-gray-500 py-8">當天沒有符合條件的乾淨新聞。</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
