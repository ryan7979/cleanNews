name: 每天定時抓取乾淨新聞

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 複製儲存庫檔案
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝相依套件
      run: |
        python -m pip install --upgrade pip
        pip install feedparser jinja2

    # 🌟 已經移除笨重的 Playwright 瀏覽器安裝步驟，速度極快

    - name: 執行新聞過濾與網頁生成
      run: python app.py

    - name: 自動將新網頁與資料庫 Commit 並推回 GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add news.db index.html archive/*.html || true
        git diff --quiet && git diff --staged --quiet || (git commit -m "自動更新新聞牆" && git push)
