name: Fetch Clean News

on:
  repository_dispatch:
    types: [trigger-news-fetch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 複製儲存庫檔案
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝相依套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 執行 AI 新聞過濾與網頁生成
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python -c "import json, os; json.dump({'GEMINI_API_KEY': os.environ['GEMINI_API_KEY']}, open('app.local.config', 'w', encoding='utf-8'))"
        python app.py

    - name: 準備 GitHub Pages 發布檔案
      run: |
        mkdir -p deploy/archive
        cp index.html news.db broadcast.png deploy/
        cp -R archive/. deploy/archive/
        cp broadcast.png deploy/archive/

    - name: 發布到 GitHub Pages gh-pages 分支
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./deploy
        force_orphan: true
